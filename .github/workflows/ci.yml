name: lightweight-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.24.4 scipy==1.12.0 Pillow==10.2.0 PyYAML==6.0.1 opencv-python-headless==4.7.0.72
      - name: Validate repository
        run: |
          python -m unittest discover -s tests -v
          python scripts/benchmark/validate_repository.py
          python -m compileall -q scripts src tests
          bash -n scripts/hpc/*.sh scripts/hpc/*.slurm
          git diff --check
      - name: Check executable entrypoints
        run: |
          test -x scripts/hpc/bootstrap_cedia.sh
          test -x scripts/hpc/run_in_container.sh
          test -x scripts/hpc/preflight_cedia.sh
          test -x scripts/hpc/smoke_cedia.slurm
