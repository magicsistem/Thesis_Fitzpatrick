<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisión de segmentación</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Thesis Fitzpatrick</p>
      <h1>Comparación de máscaras</h1>
      <p>Selecciona modelos e imágenes. Cada resultado separa la lesión de la piel circundante candidata.</p>
    </header>

    <section aria-labelledby="models-title">
      <div class="section-heading">
        <div><span class="step">1</span><h2 id="models-title">Modelos</h2></div>
        <p id="model-count">0 seleccionados</p>
      </div>
      <div id="models" class="model-grid"></div>
    </section>

    <section aria-labelledby="images-title">
      <div class="section-heading">
        <div><span class="step">2</span><h2 id="images-title">Imágenes</h2></div>
        <p id="image-count">0 seleccionadas</p>
      </div>
      <label class="range-label" for="image-limit">Seleccionar las primeras <strong id="limit-value">1</strong></label>
      <input id="image-limit" type="range" min="1" max="1" value="1">
      <div class="toolbar">
        <button id="select-visible" type="button" class="secondary">Aplicar cantidad</button>
        <button id="clear-images" type="button" class="secondary">Limpiar</button>
      </div>
      <div id="images" class="image-grid"></div>
    </section>

    <section aria-labelledby="results-title">
      <div class="section-heading">
        <div><span class="step">3</span><h2 id="results-title">Resultados</h2></div>
        <button id="run" type="button">Revisar selección</button>
      </div>
      <p id="status" role="status">Todavía no hay resultados.</p>
      <div id="carousel" class="carousel" hidden>
        <div class="carousel-nav">
          <button id="previous" class="secondary" type="button">Anterior</button>
          <span id="slide-position"></span>
          <button id="next" class="secondary" type="button">Siguiente</button>
        </div>
        <article id="slide"></article>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
